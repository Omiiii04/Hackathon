<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSINT Verifier</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div class="header">
      <div class="header-title">
        <span class="logo">🔍</span>
        <div>
          <div class="title">OSINT Verifier</div>
          <div class="subtitle">Rumor Verification Platform v5.2</div>
        </div>
      </div>
      <div id="status-dot" class="status-dot" title="Backend status"></div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="text">📝 Text</button>
      <button class="tab" data-tab="image">🖼️ Image</button>
      <button class="tab" data-tab="url">🔗 URL</button>
    </div>

    <!-- Text Tab -->
    <div class="tab-panel active" id="tab-text">
      <textarea
        id="claim-input"
        placeholder="Paste a claim, rumor, or WhatsApp forward here…"
        maxlength="2000"
      ></textarea>
      <div class="char-count"><span id="char-count">0</span>/2000</div>
      <button class="verify-btn" id="verify-text-btn">
        🔍 Verify Claim
      </button>
    </div>

    <!-- Image Tab -->
    <div class="tab-panel" id="tab-image">
      <div class="upload-area" id="upload-area">
        <div class="upload-icon">🖼️</div>
        <div class="upload-label">Drop image here or click to upload</div>
        <div class="upload-hint">JPEG, PNG, WEBP · Max 10MB</div>
        <input type="file" id="image-file-input" accept="image/jpeg,image/png,image/webp" hidden>
      </div>
      <div id="image-preview-wrap" style="display:none">
        <img id="image-preview" alt="Preview">
        <button class="remove-img-btn" id="remove-img-btn">✕ Remove</button>
      </div>
      <div class="url-row">
        <input type="url" id="image-url-input" placeholder="Or paste image URL…">
      </div>
      <button class="verify-btn" id="verify-image-btn">
        🖼️ Scan & Verify Image
      </button>
    </div>

    <!-- URL Tab -->
    <div class="tab-panel" id="tab-url">
      <input type="url" id="url-input" placeholder="https://example.com/article…">
      <button class="verify-btn secondary" id="use-current-btn">
        📄 Use Current Page
      </button>
      <button class="verify-btn" id="verify-url-btn">
        🔗 Verify Article
      </button>
    </div>

    <!-- Progress Section -->
    <div id="progress-section" style="display:none">
      <div class="progress-stage" id="progress-stage">Initializing…</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </div>

    <!-- Result Section -->
    <div id="result-section" style="display:none">

      <div class="verdict-card" id="verdict-card">
        <div id="verdict-badge"></div>
        <div id="verdict-confidence"></div>
        <div id="verdict-tag"></div>
      </div>

      <!-- Mutation alert -->
      <div id="mutation-alert" style="display:none" class="mutation-alert">
        ⚠️ <span id="mutation-text"></span>
      </div>

      <!-- Support bar -->
      <div id="support-bar-wrap">
        <div class="bar-label">Evidence Split</div>
        <div class="bar-track">
          <div id="support-fill" class="support-fill"></div>
          <div id="contradict-fill" class="contradict-fill"></div>
        </div>
        <div class="bar-legend">
          <span id="support-pct" class="support-text"></span>
          <span id="contradict-pct" class="contradict-text"></span>
        </div>
        <div id="no-evidence-state" style="display:none" class="empty-bar">
          No evidence collected
        </div>
      </div>

      <!-- Explanation -->
      <div id="explanation-wrap">
        <div class="section-label">Explanation</div>
        <div id="explanation-text"></div>
      </div>

      <!-- Sub-claims -->
      <div id="subclaims-wrap" style="display:none">
        <div class="section-label">🔀 Sub-Claims</div>
        <div id="subclaims-list"></div>
      </div>

      <!-- Image result -->
      <div id="image-result-wrap" style="display:none">
        <div class="section-label">🖼️ Image Analysis</div>
        <div id="ocr-text-result"></div>
        <div id="context-mismatch-result"></div>
      </div>

      <!-- Sources -->
      <div id="sources-wrap">
        <div class="section-label">Sources</div>
        <div id="sources-list"></div>
      </div>

      <div id="cached-label" style="display:none" class="cached-label">⚡ Cached result</div>

      <button class="verify-btn secondary" id="open-full-btn">
        📊 Open Full Dashboard
      </button>
    </div>

    <!-- Error Section -->
    <div id="error-section" style="display:none">
      <div class="error-icon">⚠️</div>
      <div class="error-msg" id="error-msg"></div>
      <button class="verify-btn secondary" id="retry-btn">Retry</button>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>OSINT Verifier · Radio Frequency Team</span>
      <a href="http://localhost:8000/docs" target="_blank" class="footer-link">API Docs</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
